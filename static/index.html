<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scratch Voice Agent</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; text-align:center; padding-top:10vh;">
    <h1>Live Voice Agent Engine</h1>
    <button id="startBtn" style="padding:15px 30px; font-size:18px; cursor:pointer;">Start Connection</button>
    <p id="status">Status: Disconnected</p>

    <script>
        const TARGET_SAMPLE_RATE = 16000;

        // Runs on the audio rendering thread. Captures mic frames and
        // posts them to the main thread as Int16 PCM, replacing the
        // deprecated ScriptProcessorNode.
        const workletSource = `
            class MicCaptureProcessor extends AudioWorkletProcessor {
                process(inputs) {
                    const channel = inputs[0][0];
                    if (channel && channel.length) {
                        const pcm = new Int16Array(channel.length);
                        for (let i = 0; i < channel.length; i++) {
                            const s = Math.min(1, Math.max(-1, channel[i]));
                            pcm[i] = s * 0x7FFF;
                        }
                        this.port.postMessage(pcm.buffer, [pcm.buffer]);
                    }
                    return true;
                }
            }
            registerProcessor('mic-capture-processor', MicCaptureProcessor);
        `;

        let ws;
        let audioCtx;
        let nextPlaybackTime = 0;
        let activeSources = [];

        document.getElementById('startBtn').addEventListener('click', async () => {
            // audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TARGET_SAMPLE_RATE });
            console.log(audioCtx.sampleRate);

            // Browsers (Safari especially) may ignore a requested sample
            // rate. Warn loudly instead of silently sending mislabeled
            // audio to the server.
            if (audioCtx.sampleRate !== TARGET_SAMPLE_RATE) {
                console.warn(
                    `AudioContext running at ${audioCtx.sampleRate}Hz, ` +
                    `not the expected ${TARGET_SAMPLE_RATE}Hz. Resampling ` +
                    `on the server or via an offline context is required ` +
                    `for accurate transcription.`
                );
            }

            nextPlaybackTime = audioCtx.currentTime;

            const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${wsProtocol}://${window.location.host}/ws/voice`);
            document.getElementById('status').innerText = "Status: Connecting...";
            ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                document.getElementById('status').innerText = "Status: Connected. Start talking!";
                await bindMicrophoneStream();
            };

            ws.onerror = () => {
                document.getElementById('status').innerText = "Status: Connection error.";
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = "Status: Disconnected.";
            };

            ws.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const signal = JSON.parse(event.data);
                    // if (signal.control === "clear_speaker_buffer") {
                    //     // Drop the AI's queued speech immediately on barge-in.
                    //     nextPlaybackTime = audioCtx.currentTime;
                    // }
                    if (signal.control === "clear_speaker_buffer") {
                        nextPlaybackTime = audioCtx.currentTime;
                        activeSources.forEach(src => {
                            try { src.stop(); } catch (e) {}
                        });
                        activeSources = [];
                    }
                    return;
                }

                // Play raw binary linear16 PCM buffers sequentially.
                const pcmData = new Int16Array(event.data);
                const float32Data = new Float32Array(pcmData.length);
                for (let i = 0; i < pcmData.length; i++) {
                    // Convert PCM Int16 to Float32 for the Web Audio API.
                    float32Data[i] = pcmData[i] / 32768.0;
                }

                const audioBuffer = audioCtx.createBuffer(1, float32Data.length, TARGET_SAMPLE_RATE);
                audioBuffer.getChannelData(0).set(float32Data);

                // const bufferSource = audioCtx.createBufferSource();
                // bufferSource.buffer = audioBuffer;
                // bufferSource.connect(audioCtx.destination);

                const bufferSource = audioCtx.createBufferSource();
                bufferSource.buffer = audioBuffer;
                bufferSource.connect(audioCtx.destination);
                activeSources.push(bufferSource);
                bufferSource.onended = () => {
                    activeSources = activeSources.filter(s => s !== bufferSource);
                };

                // Schedule chunks back-to-back to avoid gaps or crackling.
                if (nextPlaybackTime < audioCtx.currentTime) {
                    nextPlaybackTime = audioCtx.currentTime;
                }
                bufferSource.start(nextPlaybackTime);
                nextPlaybackTime += audioBuffer.duration;
            };
        });

        async function bindMicrophoneStream() {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
            });
            const audioTrack = stream.getAudioTracks()[0];
console.log("Recording from device:", audioTrack.label);
console.log("Track settings:", audioTrack.getSettings());

            const blob = new Blob([workletSource], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);
            await audioCtx.audioWorklet.addModule(workletUrl);

            const source = audioCtx.createMediaStreamSource(stream);
            const micNode = new AudioWorkletNode(audioCtx, 'mic-capture-processor');

            micNode.port.onmessage = (event) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(event.data);
                }
            };

            source.connect(micNode);
            // Intentionally not connected to destination: this node only
            // captures and forwards audio, it should not be audible.
        }
    </script>
</body>
</html>
